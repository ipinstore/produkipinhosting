<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cyber Anime Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0f0f1a, #050509);
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

/* Efek neon background */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, #00f7ff, #ff00c8, #00f7ff);
  animation: neonBG 10s linear infinite;
  opacity: 0.05;
}

@keyframes neonBG {
  0% { transform: translate(0,0); }
  100% { transform: translate(-50%, -50%); }
}

.container {
  padding: 30px;
  position: relative;
  z-index: 1;
}

/* Anime avatar */
.anime-img {
  width: 160px;
  border-radius: 50%;
  border: 3px solid #00f7ff;
  box-shadow: 0 0 20px #00f7ff, 0 0 40px #ff00c8;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 10px #00f7ff; }
  to { box-shadow: 0 0 25px #ff00c8; }
}

h1 {
  margin-top: 15px;
  font-size: 28px;
  color: #00f7ff;
  text-shadow: 0 0 10px #00f7ff;
}

p {
  color: #aaa;
}

/* Card neon */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 20px;
  margin: 20px auto;
  max-width: 300px;
  box-shadow: 0 0 15px rgba(0,255,255,0.2);
  transition: 0.3s;
}

.card:hover {
  box-shadow: 0 0 25px #00f7ff;
  transform: scale(1.03);
}

h2 {
  color: #ff00c8;
  text-shadow: 0 0 8px #ff00c8;
}

/* Button neon */
.btn {
  display: inline-block;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 10px;
  background: transparent;
  border: 2px solid #00f7ff;
  color: #00f7ff;
  cursor: pointer;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  background: #00f7ff;
  color: #000;
  box-shadow: 0 0 15px #00f7ff;
}

/* QRIS */
.qris-img {
  width: 200px;
  border-radius: 10px;
  margin-top: 10px;
  box-shadow: 0 0 15px #ff00c8;
}

footer {
  margin-top: 30px;
  font-size: 12px;
  color: #666;
}

/* Animasi masuk */
.fade-in {
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="container fade-in">

  <!-- Ganti gambar anime -->
  <img src="https://files.catbox.moe/lxwq5t.jpeg" class="anime-img">

  <h1>CYBER PAYMENT</h1>
  <p>Pilih metode pembayaran</p>

  <!-- DANA -->
  <div class="card">
    <h2>DANA</h2>
    <p id="dana">085711764473</p>
    <button class="btn" onclick="copyDana()">Salin Nomor</button>
  </div>

  <!-- QRIS -->
  <div class="card">
    <h2>QRIS</h2>
    <!-- Ganti QRIS -->
    <img src="https://files.catbox.moe/5srb9x.jpg" class="qris-img">
    <p>Scan untuk bayar</p>
  </div>

  <footer>© 2026 Cyber Payment</footer>

</div>

<script>
function copyDana() {
  const text = document.getElementById("dana").innerText;
  navigator.clipboard.writeText(text);
  alert("Nomor DANA berhasil disalin!");
}
</script>

</body>
</html>
