<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Anime</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: black;
    overflow: hidden;
    color: white;
}

/* BACKGROUND */
.glitch-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('https://i.pinimg.com/originals/8c/4c/8b/8c4c8b6f7d3d0f1a06d2b67c0b0d3b1f.gif');
    background-size: cover;
    filter: brightness(0.4);
    z-index: -2;
}

.scanline {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );
    z-index: -1;
}

/* CONTAINER */
.container {
    position: relative;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    width: 330px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 0 25px #00f7ff;
}

/* STORE NAME */
.store-name {
    font-size: 22px;
    font-weight: bold;
    color: #00f7ff;
    margin-bottom: 10px;
}

/* PRODUK */
.product {
    background: rgba(255,255,255,0.05);
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid rgba(0,255,255,0.2);
    transition: 0.3s;
}

.product:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #00f7ff;
}

.price {
    color: #00f7ff;
    font-weight: bold;
}

/* IMAGE */
.anime-img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 0 20px #00f7ff;
}

/* PAYMENT */
.payment-box {
    background: rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
}

/* BUTTON */
.btn, .btn-copy {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #00f7ff, #0066ff);
    color: white;
    cursor: pointer;
}

/* QRIS */
.qris-img {
    width: 100%;
    margin-top: 8px;
    border-radius: 10px;
    cursor: pointer;
}

/* NOTIF */
.notif {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #00f7ff;
    color: black;
    padding: 5px 10px;
    border-radius: 8px;
    display: none;
}

/* POPUP */
.popup {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.popup img {
    max-width: 90%;
}
</style>
</head>

<body>

<div class="glitch-bg"></div>
<div class="scanline"></div>

<div class="container" id="box">
    <div class="notif" id="notif">Copied!</div>

    <!-- NAMA TOKO -->
    <div class="store-name">TES SHOP</div>

    <img src="https://i.pinimg.com/736x/3e/0c/2c/3e0c2c8cbb8df2e3f2f9c92c4b8f6c3a.jpg" class="anime-img">

    <!-- PRODUK -->
    <div class="product">
        <p>SC OVALIUM</p>
        <div class="price">Rp 30.000</div>
        <div class="price">harga lengkap minta admin</div>
    </div>

    <div class="product">
        <p>BUAT LINK TOPUP</p>
        <div class="price">Rp 49.000</div>
    </div>

    <h3 style="color:#00f7ff;">Payment</h3>

    <div class="payment-box">
        <p>DANA</p>
        <b id="danaNumber">085711764473</b>
        <button class="btn-copy" onclick="copyDana()">Copy</button>
    </div>

    <div class="payment-box">
        <p>QRIS</p>
        <img src="https://files.catbox.moe/5srb9x.jpg" class="qris-img" onclick="zoomQRIS(this)">
    </div>

    <button class="btn" onclick="nextMusic()">🎧 Ganti Musik</button>

    <audio id="player" autoplay loop></audio>
</div>

<div class="popup" id="popup" onclick="closePopup()">
    <img id="popupImg">
</div>

<script>
const songs = [
    "https://files.catbox.moe/8xq6jx.mp3",
    "https://files.catbox.moe/3f7q6r.mp3",
    "https://files.catbox.moe/1h3k7g.mp3"
];

const player = document.getElementById("player");

function playRandom() {
    player.src = songs[Math.floor(Math.random() * songs.length)];
    player.play();
}

function nextMusic() {
    playRandom();
}

function copyDana() {
    const text = document.getElementById("danaNumber").innerText;
    navigator.clipboard.writeText(text);
    const notif = document.getElementById("notif");
    notif.style.display = "block";
    setTimeout(() => notif.style.display = "none", 2000);
}

function zoomQRIS(img) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupImg").src = img.src;
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
