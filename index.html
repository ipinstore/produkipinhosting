<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toko Simple</title>
  <style>
    :root{--bg:#0b1020;--card:#111a33;--line:rgba(255,255,255,.12);--text:#eaf0ff;--muted:#9fb0ff;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);padding:20px}
    .wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
    @media(max-width:860px){.wrap{grid-template-columns:1fr}}
    .card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    header{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
    header h1{margin:0;font-size:18px}
    header small{color:var(--muted)}
    .grid{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media(max-width:520px){.grid{grid-template-columns:1fr}}
    .p{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.15);display:flex;flex-direction:column;gap:10px}
    .p .img{height:120px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);background:rgba(255,255,255,.03)}
    .p b{font-size:14px}
    .p .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .btn{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-weight:650}
    .btn:hover{transform:translateY(-1px)}
    .cart{padding:16px;display:flex;flex-direction:column;gap:10px}
    .item{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.15)}
    .item small{color:var(--muted)}
    .qty{display:flex;gap:6px;align-items:center}
    .qty button{width:28px;height:28px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer}
    .total{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center}
    input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.15);color:var(--text);outline:none}
    .muted{color:var(--muted);font-size:12px;line-height:1.35}
    .cta{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(110,168,255,.55);
         background:linear-gradient(135deg, rgba(110,168,255,.25), rgba(124,255,197,.15));
         color:var(--text);cursor:pointer;font-weight:800}
    .cta:disabled{opacity:.55;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="wrap">

    <!-- PRODUK -->
    <section class="card">
      <header>
        <div>
          <h1 id="shopName">TOKO KAMU</h1>
          <small>Jualan simple + checkout ke WhatsApp</small>
        </div>
        <small id="cartCount">Keranjang: 0</small>
      </header>

      <div class="grid" id="productGrid"></div>
    </section>

    <!-- KERANJANG -->
    <aside class="card">
      <header>
        <h1>Keranjang</h1>
        <button class="btn" id="clearBtn" type="button">Kosongkan</button>
      </header>

      <div class="cart">
        <div>
          <label class="muted">Nama pembeli</label>
          <input id="buyerName" placeholder="Contoh: Andi" />
        </div>
        <div>
          <label class="muted">Alamat / Catatan</label>
          <input id="buyerNote" placeholder="Contoh: Jl. Mawar No. 12 / warna hitam" />
        </div>

        <div id="cartList" style="display:flex;flex-direction:column;gap:10px;"></div>

        <div class="total">
          <div>
            <div class="muted">Total</div>
            <div style="font-size:18px;font-weight:900" id="totalText">Rp 0</div>
          </div>
          <div style="min-width:140px">
            <button class="cta" id="waBtn" type="button" disabled>Checkout WA</button>
          </div>
        </div>

        <div class="muted">
          * Tombol Checkout akan membuka WhatsApp dengan format pesanan otomatis.
        </div>
      </div>
    </aside>

  </div>

  <script>
    // ===== UBAH INI =====
    const WHATSAPP_NUMBER = "6281234567890"; // ganti: format internasional, tanpa + (contoh Indonesia 62...)
    const SHOP_NAME = "TOKO KAMU";

    const products = [
      { id: "p1", name: "Produk A", price: 25000 },
      { id: "p2", name: "Produk B", price: 50000 },
      { id: "p3", name: "Produk C", price: 12000 },
      { id: "p4", name: "Produk D", price: 99000 },
    ];
    // ====================

    const rupiah = (n) => "Rp " + new Intl.NumberFormat("id-ID").format(n || 0);

    const productGrid = document.getElementById("productGrid");
    const cartList = document.getElementById("cartList");
    const totalText = document.getElementById("totalText");
    const cartCount = document.getElementById("cartCount");
    const waBtn = document.getElementById("waBtn");
    const clearBtn = document.getElementById("clearBtn");
    const buyerName = document.getElementById("buyerName");
    const buyerNote = document.getElementById("buyerNote");

    document.getElementById("shopName").textContent = SHOP_NAME;

    // cart: { [id]: qty }
    const cart = {};

    function renderProducts(){
      productGrid.innerHTML = products.map(p => `
        <div class="p">
          <div class="img">Foto ${p.name}</div>
          <div>
            <b>${p.name}</b><br>
            <small style="color:var(--muted)">${rupiah(p.price)}</small>
          </div>
          <div class="row">
            <button class="btn" type="button" onclick="addToCart('${p.id}')">Tambah</button>
            <small style="color:var(--muted)">ID: ${p.id}</small>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id){
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function changeQty(id, delta){
      cart[id] = (cart[id] || 0) + delta;
      if(cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function calcTotal(){
      let total = 0;
      for(const [id, qty] of Object.entries(cart)){
        const p = products.find(x => x.id === id);
        if(p) total += p.price * qty;
      }
      return total;
    }

    function renderCart(){
      const items = Object.entries(cart);
      cartCount.textContent = "Keranjang: " + items.reduce((a,[,q])=>a+q,0);

      if(items.length === 0){
        cartList.innerHTML = `<div class="muted">Keranjang masih kosong. Tambahkan produk dulu.</div>`;
        totalText.textContent = rupiah(0);
        waBtn.disabled = true;
        return;
      }

      cartList.innerHTML = items.map(([id, qty]) => {
        const p = products.find(x => x.id === id);
        const sub = p.price * qty;
        return `
          <div class="item">
            <div>
              <div style="font-weight:750">${p.name}</div>
              <small>${rupiah(p.price)} x ${qty} = ${rupiah(sub)}</small>
            </div>
            <div class="qty">
              <button type="button" onclick="changeQty('${id}', -1)">-</button>
              <div style="min-width:20px;text-align:center">${qty}</div>
              <button type="button" onclick="changeQty('${id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      totalText.textContent = rupiah(calcTotal());
      waBtn.disabled = false;
    }

    function buildWhatsAppMessage(){
      const name = (buyerName.value || "").trim() || "-";
      const note = (buyerNote.value || "").trim() || "-";

      let lines = [];
      lines.push(`Halo ${SHOP_NAME}, saya mau order:`);
      lines.push(`Nama: ${name}`);
      lines.push(`Catatan/Alamat: ${note}`);
      lines.push("");
      lines.push("Detail pesanan:");

      for(const [id, qty] of Object.entries(cart)){
        const p = products.find(x => x.id === id);
        lines.push(`- ${p.name} x${qty} = ${rupiah(p.price * qty)}`);
      }

      lines.push("");
      lines.push(`Total: ${rupiah(calcTotal())}`);
      lines.push("Mohon info cara pembayarannya ya. Terima kasih!");

      return lines.join("\n");
    }

    waBtn.addEventListener("click", () => {
      const text = encodeURIComponent(buildWhatsAppMessage());
      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`;
      window.open(url, "_blank");
    });

    clearBtn.addEventListener("click", () => {
      for(const k of Object.keys(cart)) delete cart[k];
      renderCart();
    });

    // expose functions to inline onclick
    window.addToCart = addToCart;
    window.changeQty = changeQty;

    renderProducts();
    renderCart();
  </script>
</body>
</html>
